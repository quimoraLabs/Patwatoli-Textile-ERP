services:
  postgres:
    image: postgres:18-alpine
    container_name: patwatoli_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: textile_erp
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql

  redis:
    image: redis:7-alpine
    container_name: patwatoli_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data

  floci:
    image: floci/floci:latest
    container_name: patwatoli_floci
    restart: unless-stopped
    ports:
      - "4566:4566"
    environment:
      - SERVICES=s3
    volumes:
      - flocidata:/tmp/floci

volumes:
  pgdata:
  redisdata:
  flocidata:
