services:
  - type: web
    name: patwatoli-textile-api
    runtime: go
    buildCommand: cd backend && go build -o server ./cmd/api
    startCommand: cd backend && ./server
    envVars:
      - key: PORT
        value: 8080
      - key: ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: patwatoli-postgres
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: CORS_ORIGINS
        value: https://patwatoli-erp.vercel.app

databases:
  - name: patwatoli-postgres
    databaseName: textile_erp
    user: erp_user
    plan: free
