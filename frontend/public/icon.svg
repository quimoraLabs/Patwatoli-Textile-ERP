<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b" />
      <stop offset="50%" stop-color="#312e81" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#a855f7" />
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#f59e0b" />
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0284c7" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background Squircle -->
  <rect width="512" height="512" rx="112" fill="url(#bgGrad)" />
  <rect x="8" y="8" width="496" height="496" rx="104" fill="none" stroke="url(#accentGrad)" stroke-width="4" stroke-opacity="0.4" />

  <!-- Textile Warp & Weft Grid lines (Subtle Loom Texture) -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="2">
    <line x1="96" y1="96" x2="416" y2="96" />
    <line x1="96" y1="136" x2="416" y2="136" />
    <line x1="96" y1="176" x2="416" y2="176" />
    <line x1="96" y1="216" x2="416" y2="216" />
    <line x1="96" y1="256" x2="416" y2="256" />
    <line x1="96" y1="296" x2="416" y2="296" />
    <line x1="96" y1="336" x2="416" y2="336" />
    <line x1="96" y1="376" x2="416" y2="376" />
    <line x1="96" y1="416" x2="416" y2="416" />

    <line x1="96" y1="96" x2="96" y2="416" />
    <line x1="136" y1="96" x2="136" y2="416" />
    <line x1="176" y1="96" x2="176" y2="416" />
    <line x1="216" y1="96" x2="216" y2="416" />
    <line x1="256" y1="96" x2="256" y2="416" />
    <line x1="296" y1="96" x2="296" y2="416" />
    <line x1="336" y1="96" x2="336" y2="416" />
    <line x1="376" y1="96" x2="376" y2="416" />
    <line x1="416" y1="96" x2="416" y2="416" />
  </g>

  <!-- Glowing Emblem Centerpiece: Weaving Shuttle & Fabric Loom -->
  <g filter="url(#glow)">
    <!-- Shuttle Body Diamond -->
    <path d="M256 90 L390 256 L256 422 L122 256 Z" fill="none" stroke="url(#accentGrad)" stroke-width="14" stroke-linejoin="round" />
    
    <!-- Central Yarn Spool / Core -->
    <circle cx="256" cy="256" r="54" fill="#0f172a" stroke="url(#goldGrad)" stroke-width="8" />
    
    <!-- Thread Waves -->
    <path d="M190 256 C210 230, 240 230, 256 256 C272 282, 302 282, 322 256" fill="none" stroke="url(#cyanGrad)" stroke-width="7" stroke-linecap="round" />
    
    <!-- Vertical Loom Beams -->
    <line x1="256" y1="120" x2="256" y2="185" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />
    <line x1="256" y1="327" x2="256" y2="392" stroke="#818cf8" stroke-width="8" stroke-linecap="round" />

    <!-- Corner Warp Accent Nodes -->
    <circle cx="122" cy="256" r="10" fill="#38bdf8" />
    <circle cx="390" cy="256" r="10" fill="#a855f7" />
    <circle cx="256" cy="90" r="10" fill="#fbbf24" />
    <circle cx="256" cy="422" r="10" fill="#6366f1" />
  </g>

  <!-- Text Branding: PTX ERP -->
  <text x="256" y="474" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="34" fill="#f8fafc" text-anchor="middle" letter-spacing="4">PATWATOLI ERP</text>
</svg>
